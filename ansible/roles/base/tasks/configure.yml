---
# Phase 3, configure: the basics every host role shares.
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname | default(inventory_hostname) }}"

# Salt's first boot installs the Salt minion package on every host, whatever its host role (the minion role
# configures it where it is used). Without it the testsuite's onboarding and bootstrap checks see a different host.
- name: The Salt minion package on hosts that are not minions
  ansible.builtin.include_role:
    name: packages
    tasks_from: install
  vars:
    install_packages: ["{{ 'venv-salt-minion' if install_salt_bundle | default(true) | bool else 'salt-minion' }}"]
  when: not (is_transactional | bool) and 'minion' not in roles

- name: Avahi (use_avahi)
  ansible.builtin.include_tasks: avahi.yml

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined

# salt/default/time.sls use_ntp (default true): Leap gets ntp, everything else chrony (already in the image on
# transactional hosts). Both files are the Salt ones, byte for byte.
- name: Time service
  when: use_ntp | default(true) | bool
  vars:
    _ntp_leap: "{{ ansible_facts.distribution == 'openSUSE Leap' }}"
    _ntp_unit: "{{ 'ntpd' if _ntp_leap | bool else 'chronyd' }}"
  block:
    - name: Install the time service
      ansible.builtin.include_role:
        name: packages
        tasks_from: install
      vars:
        install_packages: ["{{ 'ntp' if _ntp_leap | bool else 'chrony' }}"]
      when: not (is_transactional | bool)

    - name: Time service configuration
      ansible.builtin.copy:
        src: "{{ 'ntp.conf' if _ntp_leap | bool else 'chrony.conf' }}"
        dest: "{{ '/etc/ntp.conf' if _ntp_leap | bool else '/etc/chrony.conf' }}"
        mode: "0644"
      register: _time_conf

    - name: Time service enabled and running
      ansible.builtin.service:
        name: "{{ _ntp_unit }}"
        state: "{{ 'restarted' if _time_conf is changed else 'started' }}"
        enabled: true

- name: Disable the firewall
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [firewalld, SuSEfirewall2]   # as salt/default/firewall.sls: ufw is left alone
  failed_when: false
  when: disable_firewall | default(true) | bool
