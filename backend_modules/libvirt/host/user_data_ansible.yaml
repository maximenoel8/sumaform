#cloud-config
# Minimal first boot for provisioner = "ansible": sshd, root + key, python3.
# Everything else (repos, packages, venv-salt-minion) is done by Ansible.

# The root:linux password and ssh_pwauth are kept for parity with user_data.yaml (Salt): the documented
# vm_password fallback for hosts with no key yet (ssh backend, z/VM guests), see DESIGN.md. Key auth is the default.
disable_root: false
ssh_pwauth: true
chpasswd:
  expire: false
  list: |
     root:linux

users:
  - name: root
    ssh_authorized_keys: ${authorized_keys}

# SUSE images ship python3 and the qemu guest agent. The others do not, and with a bridge the libvirt provider
# needs the agent to read the IP, so the domain would time out without it (Salt's user_data installs it too).
# They also do not let root log in with the password (Ubuntu 24.04, Leap 16: PermitRootLogin defaults to
# prohibit-password; Salt's user_data appends PermitRootLogin yes per image). That password is the fallback login of
# ansible/inventory.py and the login of the Terraform provisioners (modules/dhcp_dns).
package_update: ${install_guest_agent}
packages:
  - python3
%{ if install_guest_agent ~}
  - qemu-guest-agent
%{ endif ~}
# 00- sorts before 50-cloud-init.conf and 60-cloudimg-settings.conf: the first value of an option wins
write_files:
  - path: /etc/ssh/sshd_config.d/00-sumaform.conf
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
runcmd:
%{ if install_guest_agent ~}
  - systemctl enable --now qemu-guest-agent
%{ endif ~}
  - systemctl restart ssh sshd || true
